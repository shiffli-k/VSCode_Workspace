<!DOCTYPE html>
<html lang='en' data-bs-theme="dark">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>MyVsCodeWorkspace</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- QRCodeJS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-4" style="max-width: 480px; width: 100%;">
        <h1>Hey there!</h1>
        <p class="text-secondary">So like this repo only has backend projects, so not sure what to put here...</p>

        <hr class="my-6">

        <h2>QR Generator</h2>
        <div class="form-floating mb-3">
            <textarea class="form-control" placeholder="Leave a comment here" id="inputTextFieldId" style="height: 70px"></textarea>
            <label for="inputTextFieldId">URL or Text Here</label>
        </div>

        <!-- 1. The Missing Target Container -->
        <!-- Wrapped in a white box so it stays scannable in Dark Mode -->
        <div class="d-flex justify-content-center mt-3">
            <div id="qrcode" class="p-3 bg-white rounded shadow-sm d-inline-block"></div>
        </div>
    </div>

    <script>
    const inputEl = document.getElementById("inputTextFieldId");
    const qrContainer = document.getElementById("qrcode");

    
    const qr = new QRCode(qrContainer, {
      text: inputEl.value || "uhhh, There is no input... So like what do you expecte me to put here -___-",
      width: 250,
      height: 250,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    
    inputEl.addEventListener("input", (e) => {
      const val = e.target.value.trim();
      if (val) {
        qr.makeCode(val);
      } else {
        qr.clear();
      }
    });
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
